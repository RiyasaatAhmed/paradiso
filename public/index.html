<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paradiso</title>

    <!-- The mark is the Play button, so the tab reads as this app rather than as
         an unlabelled page. The .ico is there for TV browsers and older sets
         that ignore the SVG; the 180px PNG is what iOS uses when the page is
         added to a home screen, which the README suggests doing. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#252527" />
    <meta name="apple-mobile-web-app-title" content="Paradiso" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/home.css" />
    <link rel="stylesheet" href="/styles/browse.css" />
    <link rel="stylesheet" href="/styles/detail.css" />
    <link rel="stylesheet" href="/styles/player.css" />
    <link rel="stylesheet" href="/styles/responsive.css" />
  </head>
  <body>
    <!-- Outside every screen, because it outlives all of them. The colours come
         from CSS rather than fill attributes so the mark stays inside the token
         system like everything else. -->
    <nav class="topbar" id="topbar">
      <button class="brand" id="brandHome" data-focus aria-label="Paradiso, back to home">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect class="brand-tile" width="64" height="64" rx="14" />
          <path class="brand-play" d="M25 19.5 46 32 25 44.5Z" stroke-width="5"
                stroke-linejoin="round" />
        </svg>
        <span class="brand-word">PARADISO</span>
      </button>
      <div class="topbar-actions">
        <button class="chip" id="toggleAll" data-focus>Show everything</button>
        <button class="chip" id="rescan" data-focus>Rescan</button>
      </div>
    </nav>

    <main id="library">

      <!-- Billboard: one big still, with the copy sitting in the darkened left of
           the frame. The scrim is what makes the text readable over an unknown
           image, which is why no headline in this app carries a text-shadow. -->
      <section class="billboard" id="billboard" hidden>
        <div class="billboard-art" id="billboardArt"></div>
        <div class="billboard-fade-left"></div>
        <div class="billboard-fade-bottom"></div>
        <div class="billboard-body">
          <h1 class="billboard-title" id="billboardTitle"></h1>
          <div class="billboard-meta" id="billboardMeta"></div>
          <div class="billboard-actions" id="billboardActions"></div>
        </div>
      </section>

      <div id="rows"></div>
      <div class="empty" id="empty" hidden></div>
    </main>

    <!-- Browse: one folder as a grid, for collections too large to walk along
         a row. The rail is hidden until there are enough items to need it. -->
    <div class="browse" id="browse" hidden>
      <header class="browse-head">
        <h2 class="browse-title" id="browseTitle"></h2>
        <div class="browse-count" id="browseCount"></div>
        <div class="browse-rail" id="browseRail" hidden></div>
      </header>
      <div class="browse-grid" id="browseGrid"></div>
    </div>

    <!-- Detail view -->
    <div class="detail" id="sheet" hidden>
      <div class="detail-art" id="detailArt"></div>
      <div class="billboard-fade-left"></div>
      <div class="billboard-fade-bottom"></div>
      <div class="detail-body">
        <h2 class="detail-title" id="sheetTitle"></h2>
        <div class="detail-meta" id="sheetSpecs"></div>
        <div class="detail-actions" id="sheetActions"></div>
        <div id="sheetOptions"></div>
        <div class="hint" id="sheetHint"></div>
      </div>
    </div>

    <!-- Player -->
    <div id="player" hidden>
      <video id="video" playsinline preload="auto"></video>
      <div id="subtitles"></div>
      <div class="spinner" id="spinner" hidden></div>
      <div class="seek-toast" id="seekToast"></div>

      <div class="player-error" id="playerError" hidden>
        <h3 id="peTitle">This file won't play</h3>
        <p id="peBody"></p>
        <div class="detail-actions" id="peActions"></div>
      </div>

      <div id="controls">
        <div class="controls-top">
          <div class="now-playing" id="nowPlaying"></div>
        </div>

        <div class="scrub">
          <div class="track" id="track">
            <div class="played" id="played"></div>
            <div class="knob" id="knob"></div>
          </div>
          <span class="time-left" id="timeLeft"></span>
        </div>

        <div class="player-buttons">
          <div class="pb-left" id="playerButtonsLeft"></div>
          <div class="pb-right" id="playerButtonsRight"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/app/client/main.js"></script>
  </body>
</html>
