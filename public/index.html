<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paradiso</title>
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/home.css" />
    <link rel="stylesheet" href="/styles/detail.css" />
    <link rel="stylesheet" href="/styles/player.css" />
    <link rel="stylesheet" href="/styles/responsive.css" />
  </head>
  <body>
    <main id="library">
      <nav class="topbar" id="topbar">
        <div class="brand">PARADISO</div>
        <div class="topbar-actions">
          <button class="chip" id="toggleAll" data-focus>Show everything</button>
          <button class="chip" id="rescan" data-focus>Rescan</button>
        </div>
      </nav>

      <!-- Billboard: big still from one title, with the copy sitting in the dark
           left-hand side of the gradient, the way Netflix anchors its home screen. -->
      <section class="billboard" id="billboard" hidden>
        <div class="billboard-art" id="billboardArt"></div>
        <div class="billboard-fade-left"></div>
        <div class="billboard-fade-bottom"></div>
        <div class="billboard-body">
          <h1 class="billboard-title" id="billboardTitle"></h1>
          <div class="billboard-meta" id="billboardMeta"></div>
          <div class="billboard-actions" id="billboardActions"></div>
        </div>
      </section>

      <div id="rows"></div>
      <div class="empty" id="empty" hidden></div>
    </main>

    <!-- Detail view -->
    <div class="detail" id="sheet" hidden>
      <div class="detail-art" id="detailArt"></div>
      <div class="billboard-fade-left"></div>
      <div class="billboard-fade-bottom"></div>
      <div class="detail-body">
        <h2 class="detail-title" id="sheetTitle"></h2>
        <div class="detail-meta" id="sheetSpecs"></div>
        <div class="detail-actions" id="sheetActions"></div>
        <div id="sheetOptions"></div>
        <div class="hint" id="sheetHint"></div>
      </div>
    </div>

    <!-- Player -->
    <div id="player" hidden>
      <video id="video" playsinline preload="auto"></video>
      <div id="subtitles"></div>
      <div class="spinner" id="spinner" hidden></div>
      <div class="seek-toast" id="seekToast"></div>

      <div class="player-error" id="playerError" hidden>
        <h3 id="peTitle">This file won't play</h3>
        <p id="peBody"></p>
        <div class="detail-actions" id="peActions"></div>
      </div>

      <div id="controls">
        <div class="controls-top">
          <div class="now-playing" id="nowPlaying"></div>
        </div>

        <div class="scrub">
          <div class="track" id="track">
            <div class="played" id="played"></div>
            <div class="knob" id="knob"></div>
          </div>
          <span class="time-left" id="timeLeft"></span>
        </div>

        <div class="player-buttons">
          <div class="pb-left" id="playerButtonsLeft"></div>
          <div class="pb-right" id="playerButtonsRight"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/app/client/main.js"></script>
  </body>
</html>
