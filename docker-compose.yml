# Paradiso, as a long-running container.
#
# Copy .env.example to .env, point PARADISO_MEDIA at your films, then:
#
#     docker compose up -d
#     docker compose logs -f     # to see the address for the TV
#
services:
  paradiso:
    build: .
    image: paradiso:latest
    container_name: paradiso
    restart: unless-stopped

    ports:
      # host:container. Change the left number to serve on a different port;
      # leave the right one at 8080, which is what the image expects.
      - "${PARADISO_PORT:-8080}:8080"

    environment:
      # Optional. The container cannot see the machine's real wifi address, so
      # set this to have the correct TV URL printed in the logs.
      PARADISO_ANNOUNCE_HOST: "${PARADISO_ANNOUNCE_HOST:-}"

    volumes:
      # Your films. Read-only: Paradiso never needs to modify them.
      - "${PARADISO_MEDIA:-./media}:/media:ro"

      # Settings. Also read-only -- it is only ever read at startup.
      - ./config.docker.json:/config/config.json:ro

      # Thumbnails, probe results and resume positions. A named volume so they
      # survive rebuilds; delete it to start clean and it just regenerates.
      - paradiso-cache:/cache

    # By default the container runs as root, which guarantees it can read your
    # media whoever owns it. To run as yourself instead, uncomment this — on
    # Linux the files must then be readable by that user.
    # user: "1000:1000"

volumes:
  paradiso-cache:
